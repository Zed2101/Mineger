name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build Tailwind
        run: npm run site:build

      - name: Snapshot the latest release for the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/latest \
            --jq '{tag_name, name, published_at, html_url, body, assets: [.assets[] | {name, size, browser_download_url, download_count}]}' \
            > site/release.json
          cat site/release.json | head -c 400; echo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
