[package]
name = "mineger"
version = "1.0.0"
description = "A Tauri app to manage minecraft servers easily!"
authors = ["Zed"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mineger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
lazy_static = "1.4"
igd-next = "0.14"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["sync", "net", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
serde_urlencoded = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
